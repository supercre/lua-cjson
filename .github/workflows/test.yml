name: Lua and LuaJIT

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - command: luajit
            package: luajit
            library: luajit-5.1
          - command: lua5.1
            package: lua5.1
            library: lua5.1
        internal_fpconv: ["OFF", "ON"]
    name: ${{ matrix.runtime.command }} / internal fpconv ${{ matrix.internal_fpconv }}
    steps:
      - uses: actions/checkout@v4
      - name: 빌드 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config luajit libluajit-5.1-dev lua5.1 liblua5.1-0-dev
      - name: CMake 빌드
        env:
          LUA_PACKAGE: ${{ matrix.runtime.package }}
          LUA_LIBRARY_NAME: ${{ matrix.runtime.library }}
          INTERNAL_FPCONV: ${{ matrix.internal_fpconv }}
        run: |
          cmake -S . -B build \
            -DLUA_INCLUDE_DIR="$(pkg-config --variable=includedir "$LUA_PACKAGE")" \
            -DLUA_LIBRARY="$(pkg-config --variable=libdir "$LUA_PACKAGE")/lib$LUA_LIBRARY_NAME.so" \
            -DUSE_INTERNAL_FPCONV="$INTERNAL_FPCONV"
          cmake --build build --parallel
      - name: 기존 동작과 64비트 정수 검증
        env:
          LUA_COMMAND: ${{ matrix.runtime.command }}
        run: sh tests/run-tests.sh "$LUA_COMMAND" build
